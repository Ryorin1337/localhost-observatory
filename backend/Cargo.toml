[package]
name = "observatory"
version = "0.1.0"
edition = "2021"
description = "Localhost Observatory 的 Windows 采集核心，以及可独立运行的本地服务"

[lib]
name = "observatory_core"
path = "src/lib.rs"

[[bin]]
name = "observatory"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# 独立运行的 HTTP + WebSocket 服务。Tauri 应用不需要它，关掉可以少编译一批依赖
server = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
ferrisetw = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"], optional = true }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
